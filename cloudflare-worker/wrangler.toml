name = "flyer-cors-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

# Secrets (never in this file):
#   wrangler secret put FLYER_API_KEY_2   # primary
#   wrangler secret put FLYER_API_KEY_3   # backup, used on 429 / quota-exceeded

# KV namespace for monthly query counter
# To create: npx wrangler kv namespace create QUERY_COUNTER
# Then replace the id below with the value returned
[[kv_namespaces]]
binding = "QUERY_COUNTER"
id = "73688b4e1153472688c857958f17244d"
